; Image Stitcher Auto - GUI default settings
; This file is read once at application startup.
; Existing per-user settings and explicitly supplied command-line options take precedence.
; GUI changes are appended to [state...] sections and override the defaults below.

[application]
; system | light | dark
theme=system
; system | japanese | english
language=system

[vulkan]
; On macOS, enabled and ignoreVramLimit also control the Metal compute path.
enabled=true
ignoreVramLimit=false
; Empty selects the first detected GPU. A saved per-user GPU selection takes precedence.
deviceKey=

[projectFile]
; Ask to save when the history contains nodes added after the last project save.
confirmSaveOnClose=true

[explorer]
; Add "Open in IS Auto" to the Windows 11 modern File Explorer context menu.
contextMenuEnabled=false

[fileInput]
; fileNameAscending | fileNameDescending | dateTimeAscending | dateTimeDescending
sortMode=fileNameAscending

[alignment]
; 1-100
horizontalOverlapPercent=25
verticalOverlapPercent=25
; 0-100
searchRangePercent=15

[arrangement]
; 1=top-left to right, 2=top-left to down, 3=top-right to left,
; 4=top-right to down, 5=bottom-left to right, 6=bottom-left to up,
; 7=bottom-right to left, 8=bottom-right to up
direction=8
; 0=automatic. Values greater than the loaded image count are clamped at runtime.
horizontalImageCount=0
verticalImageCount=0
zigzag=true

[canvas]
; none | any QColor-compatible value (for example black, white, or #202020)
background=black
; 0-100
selectedImageOpacityPercent=0
layoutLocked=false
useCanvasAsSource=false
; Any QColor-compatible value, for example #ff4040
highlightColor=#ff4040

[trwsPami]
localEnabled=false
; 4-100
localImageCount=6
localAutoIncrement=false
; 0-100
localImageCountIncrement=0
; 1-100
localIncrementCount=1
; 1-10
localSearchRadius=2
; 20-100000
localMaxIterations=5000
; 1-20
localMaxLoops=4

globalEnabled=true
; 1-10
globalSearchRadius=2
; 20-100000
globalMaxIterations=10000
; 1-50
globalMaxLoops=10

[leastSquares]
; 0.0-1.0
regressionThreshold=0.3
; 0.0-100.0
relativeThreshold=2.5
; 0.0-1000.0
absoluteThreshold=3.5
maxPairErrorForRelative=0.95

[imageMerge]
; distanceL2 | focusRegion | focusStackTenengrad | imageNumberOverwrite
mode=focusRegion
